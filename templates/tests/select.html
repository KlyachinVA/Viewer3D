<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<select name="cities" id="cities">
    <option value="1">Москва</option>
    <option value="3">Волгоград</option>
    <option value="7" selected>Ленинград</option>
</select>
</body>
<script>
    let el = document.getElementById("cities")
    let opts = el.options
    console.log("len =",opts.length)
    let k = 0
    for(let i =0; i < opts.length; i++){
        let opt = opts[i]
        let v = opt.text
        console.log(v)
        k += 1
    }
    console.log(k)
    console.log(el.selectedIndex)
</script>
</html>
