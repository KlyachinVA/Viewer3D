	function close_info(id_window){
			hide_block(id_window)
	}
	function show_dialog(id_view){
		let el = document.getElementById(id_view)
		el.style.display = "block"
		}
	function hide_dialog(id_view){
		let el = document.getElementById(id_view)
		el.style.display = "none"
		}
	function get_coords(ob){
		let box = ob.getBoundingClientRect()
		console.log(event.clientX-box.left, event.clientY - box.top)
		//console.log(box)
		}
	function show_start(id_view){
		let el = document.getElementById(id_view);
		fetch('/static/models/comments/first.html')
		.then(response => response.text())
		.then(html_s => {
			document.getElementById('start').innerHTML += html_s

			el.style.display = "block";

		}
		)
		}
	</script>
