{% extends 'base.html'%}
{% block title %}
Список 3D  сцен
{% endblock %}

{% block header %}
<h2 align="center">Список 3D  сцен</h2>
{% endblock %}

{% block content %}
<div class="imit-forms">
{% for scene in scenes %}
<p>
<a href="/manage/model_list/{{ scene.id }}">
    {{ scene.name }}
</a>
</p>
<p>
    <a href="/manage/set_position/{{ scene.id }}">
        <button>Разместить на сцене модели</button>
    </a>
</p>
<p>
    <a href = "/manage/list_models_on_scene/{{ scene.id }}">
        <button>Посмотреть список моделей для удаления со сцены</button>
    </a>
</p>
{% endfor %}
</div>
{% endblock %}
