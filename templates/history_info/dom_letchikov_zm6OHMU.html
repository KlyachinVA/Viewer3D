<div>
Дом лётчиков — так в Сталинграде (ныне Волгоград) называли 
пятиэтажный жилой дом Городского коммунального отдела (Горко), 
построенный в 1930 году. 
Здание располагалось на углу Пушкинской (в настоящее время — 
улицы Пушкина) и площади Павших Борцов, на месте современного 
медицинского университета. 
</div>
